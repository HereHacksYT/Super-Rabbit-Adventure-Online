<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Minecraft Tarzı Orman Tapınağı - Gizli Işınlanma Odası</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Arial', sans-serif; }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 10px 15px;
            border-radius: 8px;
            pointer-events: none;
            z-index: 10;
            font-size: 14px;
            backdrop-filter: blur(5px);
            border-left: 4px solid #ffaa44;
        }
        #status {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0,0,0,0.6);
            color: #ffaa66;
            padding: 8px 12px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 14px;
            pointer-events: none;
            z-index: 10;
        }
        @media (max-width: 600px) {
            #info { font-size: 10px; top: 10px; left: 10px; }
            #status { font-size: 10px; }
        }
    </style>
</head>
<body>
    <div id="info">
        🏛️ ORMAN TAPINAĞI | Siyah portala dokun → Yeşil Gizli Oda
    </div>
    <div id="status">
        📍 Konum: Dış Tapınak | 🟢 Işınlanma hazır
    </div>

    <!-- Three.js kütüphaneleri -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

        // --- BAŞLANGIÇ AYARLARI ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a1a2a); // gece/gökyüzü
        scene.fog = new THREE.FogExp2(0x0a1a2a, 0.008);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 500);
        camera.position.set(8, 4, 12);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true; // gölgeler aktif
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // CSS2 renderer için (yazı)
        const labelRenderer = new CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0px';
        labelRenderer.domElement.style.left = '0px';
        labelRenderer.domElement.style.pointerEvents = 'none';
        document.body.appendChild(labelRenderer.domElement);

        // --- KONTROLLER (Kullanıcı rahat gezinsin, ama isteğe bağlı) ---
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.screenSpacePanning = true; // yatay kaydırma
        controls.maxPolarAngle = Math.PI / 2.2;
        controls.target.set(0, 1.5, 0);

        // --- IŞIKLANDIRMA ---
        // Ortam ışığı
        const ambientLight = new THREE.AmbientLight(0x404060, 0.65);
        scene.add(ambientLight);
        // Ana güneş ışığı (gölgeli)
        const sunLight = new THREE.DirectionalLight(0xffeedd, 1.2);
        sunLight.position.set(15, 20, 5);
        sunLight.castShadow = true;
        sunLight.receiveShadow = false;
        sunLight.shadow.mapSize.width = 1024;
        sunLight.shadow.mapSize.height = 1024;
        sunLight.shadow.camera.near = 0.5;
        sunLight.shadow.camera.far = 30;
        sunLight.shadow.camera.left = -10;
        sunLight.shadow.camera.right = 10;
        sunLight.shadow.camera.top = 10;
        sunLight.shadow.camera.bottom = -10;
        scene.add(sunLight);
        // Arka doldurma ışığı
        const fillLight = new THREE.PointLight(0x5577aa, 0.4);
        fillLight.position.set(2, 3, 4);
        scene.add(fillLight);
        // yerden yansıma efekti
        const groundLight = new THREE.PointLight(0x8a6e4b, 0.3);
        groundLight.position.set(0, -1, 0);
        scene.add(groundLight);

        // Basit bir zemin (çim) - referans için
        const groundPlane = new THREE.Mesh(
            new THREE.PlaneGeometry(30, 30),
            new THREE.MeshStandardMaterial({ color: 0x4a6a3a, roughness: 0.9, metalness: 0.1 })
        );
        groundPlane.rotation.x = -Math.PI / 2;
        groundPlane.position.y = -0.2;
        groundPlane.receiveShadow = true;
        scene.add(groundPlane);

        // Yardımcı grid (isteğe bağlı)
        const gridHelper = new THREE.GridHelper(30, 20, 0x88aa77, 0x446633);
        gridHelper.position.y = -0.15;
        scene.add(gridHelper);

        // --- DOKU OLUŞTURMA (yosunlu taş, eski taş, yeşil taş) ---
        function createMossyStoneTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#8a9a7a';
            ctx.fillRect(0, 0, 512, 512);
            // taş desenleri
            for (let i = 0; i < 600; i++) {
                ctx.fillStyle = `rgba(100, 110, 80, ${Math.random() * 0.5})`;
                ctx.fillRect(Math.random() * 512, Math.random() * 512, 8 + Math.random() * 12, 6 + Math.random() * 10);
            }
            // yosun lekeleri
            for (let i = 0; i < 800; i++) {
                ctx.fillStyle = `rgba(60, 100, 50, ${Math.random() * 0.7})`;
                ctx.beginPath();
                ctx.arc(Math.random() * 512, Math.random() * 512, Math.random() * 10 + 3, 0, Math.PI * 2);
                ctx.fill();
            }
            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            texture.repeat.set(2, 2);
            return texture;
        }

        function createDarkMossyTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#5a6a4a';
            ctx.fillRect(0, 0, 512, 512);
            for (let i = 0; i < 400; i++) {
                ctx.fillStyle = `rgba(40, 60, 30, ${Math.random() * 0.6})`;
                ctx.fillRect(Math.random() * 512, Math.random() * 512, 10, 8);
            }
            for (let i = 0; i < 500; i++) {
                ctx.fillStyle = `rgba(70, 110, 60, ${Math.random() * 0.5})`;
                ctx.beginPath();
                ctx.arc(Math.random() * 512, Math.random() * 512, Math.random() * 12 + 2, 0, Math.PI * 2);
                ctx.fill();
            }
            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            texture.repeat.set(2, 2);
            return texture;
        }

        function createGreenStoneTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#6a8a5a';
            ctx.fillRect(0, 0, 512, 512);
            for (let i = 0; i < 500; i++) {
                ctx.fillStyle = `rgba(80, 130, 70, ${Math.random() * 0.6})`;
                ctx.fillRect(Math.random() * 512, Math.random() * 512, 12, 8);
            }
            for (let i = 0; i < 600; i++) {
                ctx.fillStyle = `rgba(100, 160, 80, ${Math.random() * 0.5})`;
                ctx.beginPath();
                ctx.arc(Math.random() * 512, Math.random() * 512, Math.random() * 10 + 3, 0, Math.PI * 2);
                ctx.fill();
            }
            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            texture.repeat.set(2, 2);
            return texture;
        }

        const mossyMat = new THREE.MeshStandardMaterial({ map: createMossyStoneTexture(), roughness: 0.7, metalness: 0.1 });
        const darkMossyMat = new THREE.MeshStandardMaterial({ map: createDarkMossyTexture(), roughness: 0.8, metalness: 0.05 });
        const greenStoneMat = new THREE.MeshStandardMaterial({ map: createGreenStoneTexture(), roughness: 0.6, metalness: 0.15, emissive: 0x226622, emissiveIntensity: 0.1 });

        // --- 1. DIŞ TAPINAK YAPISI (Yosunlu taş, merdiven, sütunlar) ---
        const templeGroup = new THREE.Group();

        // Taban platformu
        const basePlatform = new THREE.Mesh(new THREE.BoxGeometry(12, 0.6, 10), mossyMat);
        basePlatform.position.set(0, -0.2, 0);
        basePlatform.castShadow = true;
        basePlatform.receiveShadow = true;
        templeGroup.add(basePlatform);

        // Merdiven (4 basamak, taş)
        for (let i = 0; i < 5; i++) {
            const step = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.3, 0.9), mossyMat);
            step.position.set(0, i * 0.3, 3.2 + i * 0.5);
            step.castShadow = true;
            step.receiveShadow = true;
            templeGroup.add(step);
        }

        // Sütunlar (4 adet, ön ve arka)
        const pillarPositions = [
            { x: -3.5, z: -3 }, { x: 3.5, z: -3 },
            { x: -3.5, z: 3.2 }, { x: 3.5, z: 3.2 }
        ];
        pillarPositions.forEach(pos => {
            const pillar = new THREE.Mesh(new THREE.BoxGeometry(1, 3.5, 1), darkMossyMat);
            pillar.position.set(pos.x, 1.3, pos.z);
            pillar.castShadow = true;
            pillar.receiveShadow = true;
            templeGroup.add(pillar);
            // başlık
            const capital = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.3, 1.2), mossyMat);
            capital.position.set(pos.x, 2.9, pos.z);
            capital.castShadow = true;
            templeGroup.add(capital);
        });

        // Arka duvar (tapınak arkası, tamamen yosunlu)
        const backWall = new THREE.Mesh(new THREE.BoxGeometry(10, 3.2, 0.5), mossyMat);
        backWall.position.set(0, 1.3, -3.8);
        backWall.castShadow = true;
        templeGroup.add(backWall);

        // Yan duvarlar (kısmi)
        const leftWall = new THREE.Mesh(new THREE.BoxGeometry(0.5, 2.5, 5), mossyMat);
        leftWall.position.set(-4.2, 1, 0);
        leftWall.castShadow = true;
        templeGroup.add(leftWall);
        const rightWall = new THREE.Mesh(new THREE.BoxGeometry(0.5, 2.5, 5), mossyMat);
        rightWall.position.set(4.2, 1, 0);
        rightWall.castShadow = true;
        templeGroup.add(rightWall);

        // Çatı eğimi (basit üçgen hissi)
        const roofMat = new THREE.MeshStandardMaterial({ color: 0x6a5a4a, roughness: 0.85 });
        const roofLeft = new THREE.Mesh(new THREE.BoxGeometry(7, 0.3, 5.5), roofMat);
        roofLeft.position.set(-1.8, 2.9, 0);
        roofLeft.rotation.z = -0.25;
        roofLeft.castShadow = true;
        templeGroup.add(roofLeft);
        const roofRight = new THREE.Mesh(new THREE.BoxGeometry(7, 0.3, 5.5), roofMat);
        roofRight.position.set(1.8, 2.9, 0);
        roofRight.rotation.z = 0.25;
        roofRight.castShadow = true;
        templeGroup.add(roofRight);

        scene.add(templeGroup);

        // --- GİRİŞTEKİ SİYAH PORTAL / KARANLIK DUVAR ---
        // 3D bir plane, siyah ve yarı saydam, aynı zamanda bir 'collider' görevi görecek.
        const portalMaterial = new THREE.MeshStandardMaterial({ color: 0x000000, emissive: 0x111111, emissiveIntensity: 0.6, transparent: true, opacity: 0.85 });
        const darkPortal = new THREE.Mesh(new THREE.BoxGeometry(2.5, 3, 0.2), portalMaterial);
        darkPortal.position.set(0, 1.3, 2.5); // merdivenlerin bitiminde, girişte
        darkPortal.castShadow = false;
        scene.add(darkPortal);

        // Portalın etrafına antik çerçeve (yine yosunlu taş)
        const frameMat = new THREE.MeshStandardMaterial({ color: 0x7a8a6a });
        const frameLeft = new THREE.Mesh(new THREE.BoxGeometry(0.3, 3.2, 0.3), frameMat);
        frameLeft.position.set(-1.4, 1.4, 2.6);
        scene.add(frameLeft);
        const frameRight = new THREE.Mesh(new THREE.BoxGeometry(0.3, 3.2, 0.3), frameMat);
        frameRight.position.set(1.4, 1.4, 2.6);
        scene.add(frameRight);
        const frameTop = new THREE.Mesh(new THREE.BoxGeometry(2.8, 0.3, 0.3), frameMat);
        frameTop.position.set(0, 2.9, 2.6);
        scene.add(frameTop);

        // Portal efekti (karanlık küreler veya parçacıklar)
        const particleGeo = new THREE.SphereGeometry(0.08, 4);
        const particleMat = new THREE.MeshStandardMaterial({ color: 0x330000, emissive: 0x440000 });
        for (let i = 0; i < 60; i++) {
            const particle = new THREE.Mesh(particleGeo, particleMat);
            particle.userData = { offset: Math.random() * Math.PI * 2, speed: 0.5 + Math.random() * 0.8 };
            particle.position.set(
                (Math.random() - 0.5) * 2.2,
                0.5 + Math.random() * 2.5,
                2.7 + Math.random() * 0.2
            );
            scene.add(particle);
        }

        // --- IŞINLANMA HEDEFİ: YEŞİL TAŞ ODA (Gizli oda, uzakta konumlandırıldı)---
        const secretRoomGroup = new THREE.Group();
        secretRoomGroup.position.set(18, 1, 12); // tapınaktan uzakta, görünmeyecek

        // Zemin (yeşil taş)
        const greenFloor = new THREE.Mesh(new THREE.BoxGeometry(6, 0.5, 6), greenStoneMat);
        greenFloor.position.set(0, -0.2, 0);
        greenFloor.castShadow = true;
        greenFloor.receiveShadow = true;
        secretRoomGroup.add(greenFloor);

        // Duvarlar (yeşil taş)
        const wallHeight = 2.8;
        const walls = [
            { pos: [0, wallHeight/2, -2.8], size: [5.5, wallHeight, 0.4] }, // arka
            { pos: [0, wallHeight/2, 2.8], size: [5.5, wallHeight, 0.4] },  // ön
            { pos: [-2.8, wallHeight/2, 0], size: [0.4, wallHeight, 5.5] },  // sol
            { pos: [2.8, wallHeight/2, 0], size: [0.4, wallHeight, 5.5] }    // sağ
        ];
        walls.forEach(w => {
            const wall = new THREE.Mesh(new THREE.BoxGeometry(w.size[0], w.size[1], w.size[2]), greenStoneMat);
            wall.position.set(w.pos[0], w.pos[1], w.pos[2]);
            wall.castShadow = true;
            secretRoomGroup.add(wall);
        });

        // Tavan (yarı saydam yeşil cam efekti)
        const ceilingMat = new THREE.MeshStandardMaterial({ color: 0x88aa77, transparent: true, opacity: 0.5, emissive: 0x226622 });
        const ceiling = new THREE.Mesh(new THREE.BoxGeometry(5.2, 0.2, 5.2), ceilingMat);
        ceiling.position.set(0, wallHeight + 0.1, 0);
        ceiling.castShadow = true;
        secretRoomGroup.add(ceiling);

        // Odanın ortasında parlayan bir kristal (efekt)
        const crystalMat = new THREE.MeshStandardMaterial({ color: 0xaaffaa, emissive: 0x44ff44, emissiveIntensity: 0.5 });
        const crystal = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.6, 1, 8), crystalMat);
        crystal.position.set(0, 0.3, 0);
        crystal.castShadow = true;
        secretRoomGroup.add(crystal);

        scene.add(secretRoomGroup);

        // --- IŞINLANMA İÇİN BASİT KARAKTER (KÜP) ---
        // Oyuncu yerine, kamera kontrollü bir karakter ekleyelim. Aslında kamerayı hareket ettiren controls var,
        // ama collision için merkezde bir nokta kullanacağız. Basitlik için kameranın pozisyonu ile portal mesafesini kontrol edeceğiz.
        // Ancak OrbitControls ile kamera serbest, daha gerçekçi bir "karakter" yapmak için bir küp ekleyip kamerayı ona bağlayabiliriz.
        // Daha temiz: küp + kamera takip, WASD hareketi. Kullanıcı rahat etsin diye basit bir first-person hareket ekleyelim.
        
        // KARAKTER (Küp) ve KAMERA TAKİP
        const player = new THREE.Mesh(new THREE.BoxGeometry(0.6, 1.2, 0.6), new THREE.MeshStandardMaterial({ color: 0xffaa66, emissive: 0x442200 }));
        player.castShadow = true;
        player.position.set(0, 0.6, 4);
        scene.add(player);
        
        // Kamera, player'ı takip etsin (third-person basit)
        // Ama aynı zamanda fareyle yön kontrolü için ek kod eklemek uzar. OrbitControls ile player'ı hareket ettirip kamera peşinden gitsin.
        // Basit: player'ı WASD ile hareket ettir, kamera player'ın arkasında sabit mesafede dursun.
        // Kodu sadeleştirmek adına, portal collision'ı için player.position kontrol edilecek.
        
        // Klavye hareketi
        const keyState = { w: false, s: false, a: false, d: false };
        window.addEventListener('keydown', (e) => {
            switch(e.code) {
                case 'KeyW': keyState.w = true; break;
                case 'KeyS': keyState.s = true; break;
                case 'KeyA': keyState.a = true; break;
                case 'KeyD': keyState.d = true; break;
                default: break;
            }
        });
        window.addEventListener('keyup', (e) => {
            switch(e.code) {
                case 'KeyW': keyState.w = false; break;
                case 'KeyS': keyState.s = false; break;
                case 'KeyA': keyState.a = false; break;
                case 'KeyD': keyState.d = false; break;
                default: break;
            }
        });
        
        let playerVelocity = new THREE.Vector3(0, 0, 0);
        const gravity = -12;
        let isOnGround = true;
        
        // Basit collision için dünya engelleri: platform, merdivenler, sütunlar, duvarlar, portal çerçevesi vs.
        // Hızlıca bir collision listesi oluşturalım.
        const collidables = [];
        // Tapınak elemanları
        collidables.push(basePlatform);
        collidables.push(leftWall, rightWall, backWall);
        pillarPositions.forEach(p => {
            const pObj = new THREE.Box3().setFromObject(templeGroup.children.find(c => c.position.x === p.x && c.position.z === p.z));
            // dinamik ekleme yerine manuel: aşağıda döngü ile alacağız
        });
        // Tüm templeGroup içindeki mesh'leri topla
        templeGroup.children.forEach(child => {
            if (child.isMesh) collidables.push(child);
        });
        // Merdiven basamakları (ayrıca templeGroup içinde)
        // Portal çerçevesi
        collidables.push(frameLeft, frameRight, frameTop);
        // Ayrıca siyah portalın kendisi (collider)
        collidables.push(darkPortal);
        
        // Yerçekimi ve basit zemin kontrolü
        function updatePlayerMovement(deltaTime) {
            const speed = 4.5;
            let move = new THREE.Vector3(0, 0, 0);
            if (keyState.w) move.z -= 1;
            if (keyState.s) move.z += 1;
            if (keyState.a) move.x -= 1;
            if (keyState.d) move.x += 1;
            move.normalize();
            move.multiplyScalar(speed * deltaTime);
            
            let newPos = player.position.clone();
            newPos.x += move.x;
            newPos.z += move.z;
            
            // Basit collision kontrol (kutu)
            const playerBox = new THREE.Box3().setFromObject(player);
            let collision = false;
            for (let obj of collidables) {
                if (!obj.parent) continue;
                const objBox = new THREE.Box3().setFromObject(obj);
                if (playerBox.intersectsBox(objBox)) {
                    collision = true;
                    break;
                }
            }
            if (!collision) {
                player.position.x = newPos.x;
                player.position.z = newPos.z;
            }
            
            // Yerçekimi (sadece y ekseni, basit)
            playerVelocity.y += gravity * deltaTime;
            player.position.y += playerVelocity.y * deltaTime;
            if (player.position.y <= 0.6) {
                player.position.y = 0.6;
                playerVelocity.y = 0;
                isOnGround = true;
            } else {
                isOnGround = false;
            }
        }
        
        // Kamera takibi (third-person basit)
        const cameraOffset = new THREE.Vector3(-5, 3.5, 6);
        function updateCamera() {
            // Hedef konum: player pozisyonu + offset
            const targetPos = player.position.clone().add(cameraOffset);
            camera.position.lerp(targetPos, 0.1);
            camera.lookAt(player.position);
        }
        
        // Işınlanma durumu ve görünürlük kontrolü
        let isTeleported = false;
        let teleportCooldown = false;
        
        // Portal kontrolü
        function checkPortalTeleport() {
            if (teleportCooldown) return;
            const playerBox = new THREE.Box3().setFromObject(player);
            const portalBox = new THREE.Box3().setFromObject(darkPortal);
            if (playerBox.intersectsBox(portalBox)) {
                teleportCooldown = true;
                // Işınlanma efekti: bir an kararma
                document.getElementById('status').innerHTML = "🌀 Işınlanıyor... Yeşil Oda'ya hoş geldin!";
                // Player'ı gizli odaya taşı
                player.position.set(18, 1, 12);
                // Kameranın hemen sıçramasını engellemek için offset sıfırlama
                camera.position.copy(player.position.clone().add(cameraOffset));
                // Işınlanma sonrası 1.5 saniye cooldown
                setTimeout(() => {
                    teleportCooldown = false;
                    document.getElementById('status').innerHTML = "📍 Konum: Yeşil Gizli Oda | 💚 Kristal Odası";
                }, 1500);
                // Efekt: kısa süreli flaş
                const flash = document.createElement('div');
                flash.style.position = 'fixed';
                flash.style.top = 0; flash.style.left = 0; flash.style.width = '100%'; flash.style.height = '100%';
                flash.style.backgroundColor = 'white';
                flash.style.opacity = '0.6';
                flash.style.pointerEvents = 'none';
                flash.style.zIndex = 1000;
                document.body.appendChild(flash);
                setTimeout(() => flash.remove(), 200);
            }
        }
        
        // UI durum güncelleme (hangi bölgede olduğunu göster)
        function updateStatusText() {
            const distToPortal = player.position.distanceTo(new THREE.Vector3(0, 1.3, 2.5));
            if (!isTeleported && distToPortal < 1.8) {
                document.getElementById('status').innerHTML = "⚠️ SİYAH PORTAL'a yaklaştın! İçine gir!";
            } else if (player.position.x > 15) {
                document.getElementById('status').innerHTML = "📍 Konum: Yeşil Gizli Oda | 💚 Kadim Kristal";
            } else {
                document.getElementById('status').innerHTML = "📍 Konum: Dış Tapınak | 🟢 Merdivenlerden çık, siyah kapıdan geç";
            }
        }
        
        // Animasyon döngüsü
        let lastTime = performance.now();
        function animate() {
            const now = performance.now();
            let delta = Math.min(0.033, (now - lastTime) / 1000);
            lastTime = now;
            
            updatePlayerMovement(delta);
            updateCamera();
            checkPortalTeleport();
            updateStatusText();
            
            // Portal etrafındaki parçacıkların dönmesi
            scene.children.forEach(child => {
                if (child.isMesh && child.material && child.material.color.getHex() === 0x330000) {
                    child.position.z += Math.sin(Date.now() * 0.005) * 0.002;
                }
            });
            
            // Yeşil odadaki kristal dönsün
            if (crystal) {
                crystal.rotation.y += 0.01;
            }
            
            controls.target.lerp(player.position, 0.05); // OrbitControls varsa target güncelle
            controls.update(); // yine de çalışsın
            
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
            requestAnimationFrame(animate);
        }
        
        // Yardımcı: başlangıçta player'ı doğru yere koy
        player.position.set(0, 0.6, 4);
        
        // Işık efektleri için biraz ortam partikülü
        const starField = new THREE.Points(
            new THREE.BufferGeometry(),
            new THREE.PointsMaterial({ color: 0xaaccff, size: 0.08 })
        );
        const starCount = 800;
        const starPos = [];
        for (let i = 0; i < starCount; i++) {
            starPos.push((Math.random() - 0.5) * 200);
            starPos.push((Math.random() - 0.5) * 80 + 15);
            starPos.push((Math.random() - 0.5) * 150 - 50);
        }
        starField.geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(starPos), 3));
        scene.add(starField);
        
        // Başlat
        animate();
        
        // Konsola not
        console.log('Hazır! Orman Tapınağı, siyah portal ve yeşil gizli oda aktif. WASD ile hareket et, portalın içine gir.');
    </script>
</body>
</html>
